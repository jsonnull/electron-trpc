name: Run tests

on: [push]

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:code
      - run: pnpm test:ci
      - uses: codecov/codecov-action@v7

  test-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:code
      - name: Set up Electron sandbox
        run: |
          for sandbox in examples/*/node_modules/electron/dist/chrome-sandbox; do
            sudo chown root "$sandbox" && sudo chmod 4755 "$sandbox"
          done
      - run: xvfb-run --auto-servernum -- pnpm test:e2e
